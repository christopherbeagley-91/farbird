<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Farbird HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF3F5; --panel: #FFFFFF; --ink: #17222E; --soft: #56636F; --line: #D3DEE3;
    --crimson: #B3182B; --flax: #3D5A33; --kowhai: #F1C232; --sky: #E4EEF2; --blue: #5B8FA8;
    --display: "Bricolage Grotesque", Georgia, serif; --body: "Instrument Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111A22; --panel: #18242F; --ink: #E8EEF2; --soft: #9AA8B4; --line: #2B3A47; --sky: #1E2D39; }
  }
  :root[data-theme="dark"] { --bg: #111A22; --panel: #18242F; --ink: #E8EEF2; --soft: #9AA8B4; --line: #2B3A47; --sky: #1E2D39; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--kowhai); outline-offset: 2px; }
  a { color: inherit; }

  .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  nav.side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { font: 800 22px/1 var(--display); letter-spacing: -0.02em; padding: 4px 10px 20px; }
  .brand small { display: block; font: 500 12px var(--body); color: var(--soft); letter-spacing: 0; margin-top: 4px; }
  nav.side button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--soft); }
  nav.side button[aria-current="page"] { background: var(--sky); color: var(--ink); }
  nav.side button:hover { color: var(--ink); }
  .who { font-size: 12px; color: var(--soft); padding: 20px 10px 0; border-top: 1px solid var(--line); margin-top: 20px; }
  .who button { display: inline; width: auto; padding: 0; text-decoration: underline; color: var(--soft); font-weight: 400; }

  main { padding: 28px 32px 64px; max-width: 1280px; width: 100%; min-width: 0; }
  h1 { font: 800 32px/1.1 var(--display); letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { color: var(--soft); margin: 0 0 24px; }
  h2 { font: 700 19px/1.2 var(--display); margin: 0 0 12px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .kpi b { display: block; font: 800 32px/1.1 var(--display); }
  .kpi span { color: var(--soft); font-size: 13px; }
  .kpi.alert b { color: var(--crimson); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  .bars { display: grid; gap: 10px; }
  .barrow { display: grid; grid-template-columns: 150px 1fr 60px; gap: 10px; align-items: center; font-size: 14px; }
  .bartrack { height: 10px; background: var(--sky); border-radius: 99px; overflow: hidden; }
  .barfill { height: 100%; background: var(--flax); border-radius: 99px; }
  .barrow .n { text-align: right; color: var(--soft); font-variant-numeric: tabular-nums; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar select, .toolbar input { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; }
  .btn { border: 0; background: var(--ink); color: var(--panel); border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.danger { background: none; color: var(--crimson); box-shadow: inset 0 0 0 1px var(--line); }
  .spacer { flex: 1; }

  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--soft); font-size: 13px; white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--sky); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.group td { background: var(--bg); font-weight: 600; cursor: default; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--sky); }
  .pill.s-done, .pill.s-approved, .pill.s-live { background: #DCEBD6; color: #2C4524; }
  .pill.s-in-progress, .pill.s-sampling, .pill.s-quoted, .pill.s-sourcing, .pill.s-sampled { background: #FBEFC4; color: #5E4A07; }
  .pill.s-blocked, .pill.s-rejected { background: #F6D5D9; color: #7D1020; }
  .overdue { color: var(--crimson); font-weight: 600; }
  .muted { color: var(--soft); }
  .empty { padding: 32px; text-align: center; color: var(--soft); }

  /* Timeline */
  .tl { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; overflow-x: auto; }
  .tl-inner { min-width: 860px; position: relative; }
  .tl-head { display: grid; position: relative; height: 26px; margin-left: 300px; border-bottom: 1px solid var(--line); }
  .tl-head span { position: absolute; font-size: 12px; color: var(--soft); transform: translateX(-50%); white-space: nowrap; }
  .tl-row { display: grid; grid-template-columns: 300px 1fr; align-items: center; min-height: 30px; border-bottom: 1px solid var(--line); }
  .tl-row.phase { font-weight: 600; background: var(--bg); }
  .tl-name { font-size: 13px; padding-right: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tl-track { position: relative; height: 30px; }
  .tl-bar { position: absolute; top: 9px; height: 12px; border-radius: 99px; background: var(--blue); min-width: 8px; }
  .tl-bar.done { background: var(--flax); }
  .tl-bar.blocked { background: var(--crimson); }
  .tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--kowhai); }

  /* Plan */
  .doc { max-width: 760px; }
  .doc section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; margin-bottom: 16px; }
  .doc section header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .md table { margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; }
  .md th { position: static; }
  .md p, .md ul { margin: 8px 0; }
  .md td, .md th { cursor: default; }
  textarea.mdedit { width: 100%; min-height: 260px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: 13px/1.5 ui-monospace, Menlo, monospace; background: var(--bg); }

  /* Dialog */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, 94vw); max-height: 92vh; overflow: auto; background: var(--panel); color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(17, 26, 34, .45); }
  dialog form { padding: 22px; display: grid; gap: 12px; }
  dialog label { font-size: 13px; font-weight: 600; display: grid; gap: 4px; }
  dialog input, dialog select, dialog textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; width: 100%; }
  dialog textarea { min-height: 80px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions { display: flex; gap: 8px; margin-top: 6px; }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login .panel { width: min(420px, 100%); }
  .login input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; margin: 10px 0; background: var(--bg); }
  .note { font-size: 13px; color: var(--soft); }

  .pill.s-connected { background: #DCEBD6; color: #2C4524; }
  .pill.s-error { background: #F6D5D9; color: #7D1020; }
  .pill.s-paused { background: #FBEFC4; color: #5E4A07; }
  .pill.s-not-connected { background: var(--sky); color: var(--soft); }
  .icards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; margin-bottom: 24px; }
  .icard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
  .icard header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .icard h3 { font: 700 18px/1.2 var(--display); margin: 0; }
  .icard .cat { font-size: 13px; color: var(--soft); }
  .icard p { margin: 0; font-size: 14px; color: var(--soft); }
  .secrets { list-style: none; margin: 0; padding: 0; font: 12.5px/1.6 ui-monospace, Menlo, monospace; }
  .secrets li::before { content: "○ "; color: var(--soft); }
  .secrets li.set::before { content: "● "; color: var(--flax); }
  .icard .meta { font-size: 13px; color: var(--soft); }
  .icard .err { font-size: 13px; color: var(--crimson); }
  .icard footer { display: flex; gap: 8px; align-items: center; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
  .toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
  .phase-h { font: 700 15px/1.2 var(--body); color: var(--soft); margin: 8px 0 10px; }
  .health { display: flex; flex-wrap: wrap; gap: 8px; }
  td a.ext { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    nav.side { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; }
    nav.side button { width: auto; }
    .brand { width: 100%; padding-bottom: 8px; }
    .who { width: 100%; border: 0; margin: 0; padding: 4px 10px; }
    main { padding: 20px 16px 48px; }
    .grid2 { grid-template-columns: 1fr; }
    .two { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const SUPABASE_URL = "https://fmrabsrgdwqhyxcjnfgt.supabase.co";
const SUPABASE_KEY = "sb_publishable_QwqBZMs_EqITjZ9hRSI9ig_Cu2Wnc7v";
const LAST_ORDER = "2026-12-12";
const PRESALE = "2026-11-09";
const WAITLIST_TARGET = 500;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-");
const nzd = n => n == null || n === "" ? "" : "NZ$" + Number(n).toLocaleString("en-NZ", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => d ? new Date(d + "T00:00:00").toLocaleDateString("en-NZ", { day: "numeric", month: "short" }) : "";
const daysTo = d => Math.ceil((new Date(d + "T00:00:00") - new Date(today() + "T00:00:00")) / 864e5);
const plural = w => w.endsWith("y") ? w.slice(0, -1) + "ies" : w.endsWith("s") ? w : w + "s";
const md = s => DOMPurify.sanitize(marked.parse(s || ""));
const pref = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

/* ---------- Table configs: one CRUD engine drives every list ---------- */
const OWNERS = ["Chris", "Mum", "Lauren", "Lynn", "Chris + Mum", "Chris + Lauren", "Lauren + Mum", "Lauren + Lynn", "All"];
const T = {
  hq_tasks: {
    label: "task", order: ["due_date", true], group: "phase",
    filters: ["workstream", "owner", "status"],
    fields: [
      { k: "title", label: "Task", req: true, wide: true },
      { k: "phase", label: "Phase", type: "select", opts: ["1. Lock", "2. Build demand", "3. Pre-sale", "4. Sell & batch-buy", "5. Last-minute push", "6. Dispatch", "7. Convert", "Backlog"] },
      { k: "workstream", label: "Workstream", type: "select", opts: ["Brand", "Product & Suppliers", "Print & Packaging", "Waitlist & Tech", "Marketing", "Partnerships", "Ops", "Finance & Legal", "General"] },
      { k: "owner", label: "Owner", type: "select", opts: OWNERS },
      { k: "status", label: "Status", type: "select", opts: ["To do", "In progress", "Blocked", "Done"], pill: true },
      { k: "start_date", label: "Start", type: "date" },
      { k: "due_date", label: "Due", type: "date", due: true },
      { k: "clickup_url", label: "ClickUp", type: "url", link: "Open" },
      { k: "notes", label: "Notes", type: "textarea", hide: true }
    ]
  },
  hq_suppliers: {
    label: "supplier", order: ["name", true], filters: ["category", "status", "owner"],
    fields: [
      { k: "name", label: "Supplier", req: true },
      { k: "category", label: "Category", type: "select", opts: ["Chocolate & sweets", "Coffee & tea", "Pantry", "Skincare & body", "Homeware", "Kids", "Packaging", "Print", "Courier", "China branded items", "Other"] },
      { k: "location", label: "Location" },
      { k: "contact", label: "Contact" },
      { k: "products", label: "Products", hide: true, type: "textarea" },
      { k: "unit_cost_nzd", label: "Unit cost", type: "number", money: true },
      { k: "moq", label: "MOQ", type: "number" },
      { k: "lead_time_days", label: "Lead days", type: "number" },
      { k: "status", label: "Status", type: "select", opts: ["Prospect", "Contacted", "Quoted", "Sampling", "Approved", "Rejected"], pill: true },
      { k: "owner", label: "Owner", type: "select", opts: OWNERS },
      { k: "notes", label: "Notes", type: "textarea", hide: true }
    ]
  },
  hq_boxes: {
    label: "box", order: ["name", true], filters: ["kind", "status"],
    fields: [
      { k: "name", label: "Box", req: true },
      { k: "kind", label: "Type", type: "select", opts: ["Relationship", "Persona", "Drop"] },
      { k: "tier", label: "Tier" },
      { k: "price_nzd", label: "Price", type: "number", money: true },
      { k: "cogs_nzd", label: "COGS", type: "number", money: true },
      { k: "_gp", label: "Gross profit", calc: r => r.price_nzd && r.cogs_nzd ? Number(r.price_nzd) - Number(r.cogs_nzd) : null, money: true },
      { k: "items", label: "Contents", type: "textarea" },
      { k: "status", label: "Status", type: "select", opts: ["Concept", "Sourcing", "Sampled", "Live", "Retired"], pill: true },
      { k: "notes", label: "Notes", type: "textarea", hide: true }
    ]
  },
  hq_finance: {
    label: "line", order: ["kind", true], filters: ["kind", "category"],
    fields: [
      { k: "kind", label: "Type", type: "select", opts: ["Budget", "Actual cost", "Revenue"], req: true },
      { k: "category", label: "Category", type: "select", opts: ["Legal & admin", "Product", "Print", "Marketing", "Tech", "Brand", "Ops", "Sales"], req: true },
      { k: "item", label: "Item", req: true },
      { k: "amount_nzd", label: "Amount", type: "number", money: true, req: true },
      { k: "entry_date", label: "Date", type: "date" },
      { k: "notes", label: "Notes", type: "textarea" }
    ]
  },
  hq_channels: {
    label: "channel", order: ["channel", true], filters: ["type", "status", "owner"],
    fields: [
      { k: "channel", label: "Channel", req: true },
      { k: "type", label: "Type", type: "select", opts: ["Community", "Partnership", "Event", "Influencer", "Content", "Loop", "Paid"] },
      { k: "owner", label: "Owner", type: "select", opts: OWNERS },
      { k: "status", label: "Status", type: "select", opts: ["Planned", "Live", "Paused", "Done"], pill: true },
      { k: "target", label: "Target" },
      { k: "result", label: "Result" },
      { k: "cost_nzd", label: "Cost", type: "number", money: true },
      { k: "notes", label: "Notes", type: "textarea", hide: true }
    ]
  }
};

const VIEWS = [
  ["overview", "Overview"], ["tasks", "Tasks"], ["timeline", "Timeline"], ["waitlist", "Waitlist"],
  ["boxes", "Boxes"], ["suppliers", "Suppliers"], ["finance", "Financials"], ["marketing", "Marketing"], ["plan", "Plan"], ["integrations", "Integrations"]
];
let state = { view: pref.get("hq_view") || "overview", user: null, filters: {}, cache: {} };

/* ---------- Auth ---------- */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  state.user = session.user;
  const { data: ok, error } = await sb.rpc("is_team");
  if (error || !ok) return renderLogin(`${esc(session.user.email)} isn't on the Farbird team list. Ask Chris to add you.`);
  renderShell();
}
sb.auth.onAuthStateChange((evt) => { if (evt === "SIGNED_IN" || evt === "SIGNED_OUT") boot(); });

function renderLogin(msg) {
  app.innerHTML = `<div class="login"><div class="panel">
    <h1>Farbird HQ</h1>
    <p class="sub" style="margin-bottom:8px">Sign in with your email. We'll send you a link.</p>
    <form id="loginForm"><label class="note" for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="email" required>
      <button class="btn" style="width:100%">Email me a sign-in link</button></form>
    <p class="note" id="loginMsg">${msg || ""}</p>
    ${state.user ? `<button class="btn ghost" id="signout">Sign out</button>` : ""}
  </div></div>`;
  document.getElementById("loginForm").onsubmit = async e => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    document.getElementById("loginMsg").textContent = error ? "That didn't send: " + error.message : `Check ${email} for your sign-in link.`;
  };
  const so = document.getElementById("signout"); if (so) so.onclick = () => sb.auth.signOut();
}

/* ---------- Shell ---------- */
function renderShell() {
  app.innerHTML = `<div class="shell">
    <nav class="side" aria-label="Sections">
      <div class="brand">Farbird HQ<small>Christmas 2026 launch</small></div>
      ${VIEWS.map(([k, l]) => `<button data-view="${k}">${l}</button>`).join("")}
      <div class="who">${esc(state.user.email)}<br><button id="signout">Sign out</button></div>
    </nav>
    <main id="main"></main></div>`;
  app.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
  document.getElementById("signout").onclick = () => sb.auth.signOut();
  go(state.view);
}
function go(v) {
  state.view = v; pref.set("hq_view", v);
  app.querySelectorAll("[data-view]").forEach(b => b.dataset.view === v ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  ({ overview, tasks, timeline, waitlist, boxes, suppliers, finance, marketing, plan, integrations })[v]();
}
const main = () => document.getElementById("main");
async function load(table) {
  const { data, error } = await sb.from(table).select("*");
  if (error) { main().innerHTML = `<div class="panel">Couldn't load ${table}: ${esc(error.message)}</div>`; throw error; }
  state.cache[table] = data; return data;
}

/* ---------- Generic list view ---------- */
async function listView(table, title, sub, extraTop = "") {
  const cfg = T[table];
  main().innerHTML = `<h1>${title}</h1><p class="sub">${sub}</p>${extraTop}<div id="tbl"></div>`;
  const rows = await load(table);
  drawList(table, rows);
}
function drawList(table, rows) {
  const cfg = T[table];
  const f = state.filters[table] ||= {};
  const visible = cfg.fields.filter(x => !x.hide);
  let r = rows.filter(row => Object.entries(f).every(([k, v]) => !v || (k === "_q" ? JSON.stringify(row).toLowerCase().includes(v.toLowerCase()) : row[k] === v)));
  const [ok, asc] = cfg.order;
  r.sort((a, b) => String(a[ok] ?? "9999").localeCompare(String(b[ok] ?? "9999")) * (asc ? 1 : -1));
  if (cfg.group) r.sort((a, b) => String(a[cfg.group] ?? "zz").localeCompare(String(b[cfg.group] ?? "zz")));

  const filt = cfg.filters.map(k => {
    const fd = cfg.fields.find(x => x.k === k);
    const vals = fd.opts || [...new Set(rows.map(x => x[k]).filter(Boolean))].sort();
    return `<select data-f="${k}" aria-label="Filter by ${fd.label}"><option value="">All ${plural(fd.label.toLowerCase())}</option>${vals.map(v => `<option ${f[k] === v ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
  }).join("");

  let body = "", lastG;
  for (const row of r) {
    if (cfg.group && row[cfg.group] !== lastG) { lastG = row[cfg.group]; body += `<tr class="group"><td colspan="${visible.length}">${esc(lastG || "No phase")}</td></tr>`; }
    body += `<tr data-id="${row.id}">${visible.map(fd => cell(fd, row)).join("")}</tr>`;
  }
  document.getElementById("tbl").innerHTML = `
    <div class="toolbar">${filt}<input data-f="_q" placeholder="Search" value="${esc(f._q || "")}" aria-label="Search">

function cell(fd, row) {
  const v = fd.calc ? fd.calc(row) : row[fd.k];
  if (fd.money) return `<td class="num">${nzd(v)}</td>`;
  if (fd.link) return `<td>${v && /^https:\/\//.test(v) ? `<a class="ext" href="${esc(v)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${fd.link}</a>` : ""}</td>`;
  if (fd.pill) return `<td><span class="pill s-${slug(v)}">${esc(v)}</span></td>`;
  if (fd.type === "date") {
    const late = fd.due && v && row.status !== "Done" && v < today();
    return `<td class="${late ? "overdue" : ""}" style="white-space:nowrap">${fmtDate(v)}</td>`;
  }
  if (fd.type === "textarea") return `<td class="muted">${esc(String(v || "").slice(0, 90))}</td>`;
  return `<td>${esc(v)}</td>`;
}

/* ---------- Edit dialog ---------- */
function editRow(table, row) {
  const cfg = T[table], isNew = !row.id;
  const dlg = document.getElementById("dlg"), form = document.getElementById("dlgForm");
  const input = fd => {
    const v = row[fd.k] ?? "";
    if (fd.type === "select") return `<select name="${fd.k}">${fd.req ? "" : `<option value=""></option>`}${fd.opts.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}${v && !fd.opts.includes(v) ? `<option selected>${esc(v)}</option>` : ""}</select>`;
    if (fd.type === "textarea") return `<textarea name="${fd.k}">${esc(v)}</textarea>`;
    return `<input name="${fd.k}" type="${fd.type || "text"}" ${fd.type === "number" ? 'step="any"' : ""} value="${esc(v)}" ${fd.req ? "required" : ""}>`;
  };
  const fields = cfg.fields.filter(fd => !fd.calc);
  form.innerHTML = `<h2>${isNew ? "Add" : "Edit"} ${cfg.label}</h2>
    ${fields.map(fd => `<label>${fd.label}${input(fd)}</label>`).join("")}
    ${!isNew && row.updated_at ? `<p class="note">Last updated ${new Date(row.updated_at).toLocaleString("en-NZ")}</p>` : ""}
    <p class="note" id="dlgErr" role="alert"></p>
    <div class="actions"><button class="btn" value="save">Save</button><button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
    <span class="spacer"></span>${isNew ? "" : `<button class="btn danger" value="delete" formnovalidate>Delete</button>`}</div>`;
  form.onsubmit = async e => {
    const action = e.submitter?.value;
    if (action === "cancel") return;
    e.preventDefault();
    let res;
    if (action === "delete") {
      if (!confirm(`Delete this ${cfg.label}?`)) return;
      res = await sb.from(table).delete().eq("id", row.id);
    } else {
      const payload = {};
      fields.forEach(fd => { const val = form.elements[fd.k].value.trim(); payload[fd.k] = val === "" ? null : (fd.type === "number" ? Number(val) : val); });
      res = isNew ? await sb.from(table).insert(payload) : await sb.from(table).update(payload).eq("id", row.id);
    }
    if (res.error) { document.getElementById("dlgErr").textContent = "Didn't save: " + res.error.message; return; }
    dlg.close(); go(state.view);
    if (table === "hq_tasks") pushTasksToClickup();
  };
  dlg.showModal();
}

async function drawBreakeven(budget, spent, revenue) {
  const { data: boxes } = await sb.from("hq_boxes").select("price_nzd, cogs_nzd, status");
  const priced = (boxes || []).filter(b => b.price_nzd && b.cogs_nzd);
  const avgGp = priced.length ? priced.reduce((s, b) => s + (b.price_nzd - b.cogs_nzd), 0) / priced.length : 25;
  const avgPrice = (boxes || []).filter(b => b.price_nzd).reduce((s, b, _, a) => s + b.price_nzd / a.length, 0) || 89;
  const el = document.getElementById("be");
  const saved = { gp: Number(pref.get("be_gp")) || Math.round(avgGp * 100) / 100, per: Number(pref.get("be_per")) || 1.6 };
  el.innerHTML = `<h2>Breakeven</h2>
    <p class="note" style="margin:0 0 12px">Costs to cover = the larger of budget or actual spend. ${priced.length ? `Gross profit starts from your ${priced.length} costed box${priced.length > 1 ? "es" : ""}.` : "Add COGS to boxes to replace the NZ$25 starting estimate."}</p>
    <div class="toolbar">
      <label class="note">Gross profit per box (NZ$) <input id="beGp" type="number" step="0.5" min="1" value="${saved.gp}" style="width:90px"></label>
      <label class="note">Boxes per customer <input id="bePer" type="number" step="0.1" min="1" value="${saved.per}" style="width:70px"></label>
    </div>
    <div class="kpis" id="beOut" style="margin:0"></div>`;
  const calc = () => {
    const gp = Math.max(1, Number(document.getElementById("beGp").value) || 1);
    const per = Math.max(1, Number(document.getElementById("bePer").value) || 1);
    pref.set("be_gp", gp); pref.set("be_per", per);
    const cost = Math.max(budget, spent);
    const boxesNeeded = Math.ceil(cost / gp);
    const customers = Math.ceil(boxesNeeded / per);
    const soldEst = Math.round(revenue / avgPrice);
    const pct = Math.min(100, Math.round((soldEst / boxesNeeded) * 100));
    document.getElementById("beOut").innerHTML = `
      <div class="kpi"><b>${nzd(cost)}</b><span>costs to cover</span></div>
      <div class="kpi"><b>${boxesNeeded}</b><span>boxes to break even</span></div>
      <div class="kpi"><b>${customers}</b><span>customers at ${per} boxes each</span></div>
      <div class="kpi"><b>${pct}%</b><span>of the way (about ${soldEst} boxes sold so far)</span></div>`;
  };
  document.getElementById("beGp").oninput = calc;
  document.getElementById("bePer").oninput = calc;
  calc();
}

async function integrations() {
  main().innerHTML = `<h1>Integrations</h1>
    <p class="sub">Every outside tool connects through Supabase. Keys stay in Supabase secrets, never in this page.</p>
    <div class="toolbar">
      <button class="btn" id="intCheck">Check connections</button>
      <button class="btn ghost" id="intTest">Run self-test</button>
      <a class="btn ghost" href="${SECRETS_URL}" target="_blank" rel="noopener" style="text-decoration:none">Add secrets in Supabase</a>
      <span class="spacer"></span><span class="muted" id="intMsg" role="status"></span>
    </div>
    <p class="note" id="intSummary" style="margin:0 0 16px"></p>
    <div id="intCards">Loading…</div>
    <h2 style="margin-top:8px">Recent activity</h2><div id="intLog"></div>`;
  document.getElementById("intCheck").onclick = () => drawIntegrations(true);
  document.getElementById("intTest").onclick = runSelfTest;
  await drawIntegrations(true);
}

async function drawIntegrations(live) {
  const msg = document.getElementById("intMsg");
  let rows, secretsKnown = false;
  if (live) {
    msg.textContent = "Checking connections…";
    try {
      rows = (await callIntegrations({ action: "status" })).integrations;
      secretsKnown = true;
      msg.textContent = `Checked ${new Date().toLocaleTimeString("en-NZ", { hour: "numeric", minute: "2-digit" })}`;
    } catch (e) {
      msg.textContent = "Couldn't reach the integrations service: " + e.message;
    }
  }
  if (rows) {
    state.secrets = Object.fromEntries(rows.map(r => [r.key, r.secrets || {}]));
  } else {
    const { data, error } = await sb.from("integrations").select("*").order("sort");
    if (error) { document.getElementById("intCards").textContent = error.message; return; }
    rows = data.map(r => ({ ...r, secrets: state.secrets?.[r.key] }));
    secretsKnown = Boolean(state.secrets);
  }
  const { data: logs } = await sb.from("sync_log").select("*").order("created_at", { ascending: false }).limit(60);
  const byKey = {}; (logs || []).forEach(l => (byKey[l.integration_key] ||= []).push(l));
  const tools = rows.filter(r => r.key !== "system");

  document.getElementById("intCards").innerHTML = PHASES.map(ph => {
    const group = tools.filter(t => t.phase === ph);
    if (!group.length) return "";
    return `<h3 class="phase-h">${esc(ph)}</h3><div class="icards">${group.map(t => card(t, secretsKnown, byKey[t.key] || [])).join("")}</div>`;
  }).join("");

  document.getElementById("intLog").innerHTML = `<div class="tablewrap"><table><thead><tr><th>When</th><th>Tool</th><th>Result</th><th>Detail</th></tr></thead><tbody>
    ${(logs || []).slice(0, 25).map(l => `<tr style="cursor:default"><td style="white-space:nowrap">${when(l.created_at)}</td><td>${esc((rows.find(r => r.key === l.integration_key) || {}).name || l.integration_key)}</td>
      <td><span class="pill s-${l.status === "ok" ? "done" : l.status === "error" ? "blocked" : "to-do"}">${esc(l.status)}</span></td><td class="muted">${esc(l.message)}</td></tr>`).join("")
      || `<tr><td colspan="4" class="empty">No activity yet. Run the self-test to see the plumbing work.</td></tr>`}
  </tbody></table></div>`;

  document.querySelectorAll("[data-sync]").forEach(b => b.onclick = () => syncNow(b.dataset.sync, b));
  document.querySelectorAll("[data-setup]").forEach(cb => cb.onchange = async () => {
    const { error } = await sb.from("integrations").update({ status: cb.checked ? "connected" : "not_connected" }).eq("key", cb.dataset.setup);
    msg.textContent = error ? "Didn't save: " + error.message : `${cb.dataset.name} marked ${cb.checked ? "set up" : "not set up"}.`;
    if (!error) drawIntegrations(false);
  });
  const monthly = tools.reduce((sum, t) => sum + Number(t.config?.monthly_cost_nzd || 0), 0);
  const setUp = tools.filter(t => t.status === "connected").length;
  document.getElementById("intSummary").innerHTML = `${setUp} of ${tools.length} tools set up · fixed running cost about ${nzd(monthly)} a month, plus Stripe fees per sale`;
  document.querySelectorAll("[data-enable]").forEach(cb => cb.onchange = async () => {
    const { error } = await sb.from("integrations").update({ enabled: cb.checked }).eq("key", cb.dataset.enable);
    msg.textContent = error ? "Didn't save: " + error.message : `${cb.checked ? "Scheduled syncing on" : "Scheduled syncing off"} for ${cb.dataset.name}.`;
  });
}

function card(t, secretsKnown, logs) {
  const req = t.required_secrets || [];
  const secrets = req.length
    ? `<ul class="secrets" aria-label="Secrets needed">${req.map(n => `<li class="${secretsKnown && t.secrets?.[n] ? "set" : ""}">${esc(n)}${secretsKnown ? (t.secrets?.[n] ? "" : " (not set)") : ""}</li>`).join("")}</ul>`
    : `<p>No secrets needed.</p>`;
  const last = logs[0];
  const c = t.config || {};
  const manual = c.kind === "manual";
  const open = c.account_url ? `<a class="btn ghost" href="${esc(c.account_url)}" target="_blank" rel="noopener" style="text-decoration:none">Open</a>` : "";
  const label = manual ? (t.status === "connected" ? "Set up" : "Not set up") : statusLabel(t.status);
  return `<article class="icard">
    <header><div><h3>${esc(t.name)}</h3><span class="cat">${esc(t.category)}</span></div><span class="pill s-${slug(t.status)}">${esc(label)}</span></header>
    <p>${esc(t.description || "")}</p>
    <div class="meta">Owner: ${esc(c.owner || "Unassigned")} · ${esc(c.cost_note || "Free")}</div>
    ${manual ? "" : secrets}
    ${manual ? "" : `<div class="meta">Last sync: ${when(t.last_sync_at)} · every ${t.sync_every_minutes >= 1440 ? "day" : t.sync_every_minutes + " min"}</div>`}
    ${t.last_error ? `<div class="err">${esc(t.last_error)}</div>` : !manual && last ? `<div class="meta">Latest: ${esc(last.message || last.status)}</div>` : ""}
    <footer>
      ${manual
        ? `<label class="toggle"><input type="checkbox" data-setup="${esc(t.key)}" data-name="${esc(t.name)}" ${t.status === "connected" ? "checked" : ""}> Account set up</label>`
        : `<button class="btn" data-sync="${esc(t.key)}">Sync now</button>
           <label class="toggle"><input type="checkbox" data-enable="${esc(t.key)}" data-name="${esc(t.name)}" ${t.enabled ? "checked" : ""}> Scheduled sync</label>`}
      <span class="spacer"></span>${open}
    </footer>
  </article>`;
}

async function syncNow(key, btn) {
  const msg = document.getElementById("intMsg");
  btn.disabled = true; btn.textContent = "Syncing…";
  try {
    const r = await callIntegrations({ action: "sync", key });
    msg.textContent = r.message;
  } catch (e) {
    msg.textContent = "Sync failed: " + e.message;
  }
  await drawIntegrations(false);
}

async function runSelfTest() {
  const msg = document.getElementById("intMsg");
  msg.textContent = "Running self-test…";
  try {
    const r = await callIntegrations({ action: "selftest" });
    const failed = r.results.filter(x => !x.pass);
    msg.textContent = r.pass ? `Self-test passed: ${r.results.length}/${r.results.length} checks.` : `Self-test failed: ${failed.map(f => f.check).join(", ")}`;
  } catch (e) {
    msg.textContent = "Self-test couldn't run: " + e.message;
  }
  await drawIntegrations(false);
}

boot();
</script>
</body>
</html>
